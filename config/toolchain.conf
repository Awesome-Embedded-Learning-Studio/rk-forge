# toolchain.conf — declarative toolchain config.
# A future Python CLI reads this file DIRECTLY (no `export` side-effects here —
# scripts/lib/toolchain.sh does the exporting). RK3506 = 32-bit ARM Cortex-A7, armhf.

# Arm GNU Toolchain 15.2.Rel1 (gcc 15.2.1, Build arm-15.86, 2025-12-03;
# arm-none-linux-gnueabihf), installed system-wide under /opt. Replaces the
# ATK-vendor-bundled Linaro gcc 10.3 as part of the "kill vendor-sdk" roadmap
# (see document/notes/12 + memory: kill-vendor-sdk-roadmap, toolchain/busybox).
# Verified locally: trivial C -> ELF32 / Machine: ARM / hard-float ABI
# (Flags 0x5000400), Tag_CPU_arch v7, Tag_FP_arch VFPv3 — matches Cortex-A7/armhf.
# NOTE: the gcc-10.3 artifacts are board-verified byte-for-byte; a full rebuild
# + on-board re-verification is the NEXT step before gcc 15.2 is called verified.
# Vendor path kept commented below as a known-good fallback.
TOOLCHAIN_PREFIX="arm-none-linux-gnueabihf-"
ARCH="arm"

# Absolute /opt bin dir (no ${PROJECT_ROOT} token needed). scripts/lib/toolchain.sh
# prepends this to PATH when env-setup.sh is sourced. The dir is also exported in
# ~/.zshrc / ~/.profile for ad-hoc cross-compilation outside the project.
TOOLCHAIN_BIN_DIR="/opt/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-linux-gnueabihf/bin"
TOOLCHAIN_SYSROOT=""

# --- Fallback: ATK vendor toolchain (gcc 10.3, board-verified, do not delete) ---
# Was the ACTUAL builder of our verified U-Boot/kernel/rootfs (produced
# rk3506-mainline.itb). NOT the Debian gcc-arm-linux-gnueabihf pkg. Flip
# TOOLCHAIN_BIN_DIR back here if the gcc 15.2 rebuild fails on board.
# TOOLCHAIN_BIN_DIR="${PROJECT_ROOT}/reference/vendor-sdk/prebuilts/gcc/linux-x86/arm/gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf/bin"
