# RKBOOT-RK3506B-aes.ini — forge-owned loader recipe for boot_merger.
#
# Reproduces the RK3506B NAND loader (MiniLoaderAll.bin = idblock) from rkbin
# blobs. This is a TEMPLATE: @DDR_BIN@ / @USBPLUG_BIN@ / @SPL_BIN@ are the blob
# FILENAMES (version varies across rkbin trees — scripts/pack-loader.sh globs
# them and substitutes). bin/rk35/ is relative to boot_merger's CWD (pack-loader.sh
# symlinks it at the rkbin blob dir). See notes/09 §二①, BLOBS.md.
#
# Structure mirrors vendor rkbin/RKBOOT/RK3506BMINIALL.ini byte-for-byte; only the
# output names are genericized (@LOADER_OUT@ / @IDB_OUT@).

[CHIP_NAME]
NAME=RK350F
[VERSION]
MAJOR=1
MINOR=1
[CODE471_OPTION]
NUM=1
Path1=bin/rk35/@DDR_BIN@
[CODE472_OPTION]
NUM=1
Path1=bin/rk35/@USBPLUG_BIN@
[LOADER_OPTION]
NUM=2
LOADER1=FlashData
LOADER2=FlashBoot
FlashData=bin/rk35/@DDR_BIN@
FlashBoot=bin/rk35/@SPL_BIN@
[LOADER2_PARAM]
LOAD_ADDR=0x3f00000
FLAG=0x0
[OUTPUT]
PATH=@LOADER_OUT@
IDB_PATH=@IDB_OUT@
[SYSTEM]
NEWIDB=true
[FLAG]
471_RC4_OFF=true
RC4_OFF=true
CREATE_IDB=true
