# RKBOOT-RK3568-atk.ini — forge-owned loader recipe for boot_merger (rk3568-atk).
#
# Produces the RKFW download loader (MiniLoaderAll.bin) for the eMMC update.img — the
# rkdeveloptool/RKDevTool `db` helper that brings the board into download mode (carries
# the Rockchip USB download protocol + the RK3568 chip tag). This is SEPARATE from the
# eMMC boot loader: the @0x40 idbloader that BootROM loads on EVERY boot is the mainline
# binman idbloader.img (build-uboot.sh), NOT this. binman's idbloader lacks the vendor
# download protocol, so the update.img still needs this boot_merger MiniLoaderAll purely
# as the one-shot download helper — built from the SAME public rkbin blobs as aes (no
# vendor-sdk). The A/B loader distinction is documented in document/sdk-diff-rk3568.md.
#
# Structure mirrors rkbin's RKBOOT/RK3568MINIALL.ini; @DDR_BIN@/@USBPLUG_BIN@/@SPL_BIN@
# are blob FILENAMES (pack-loader.sh globs them via the board's RKBIN_*_PAT + substitutes).
# NO BL31 segment here — ATF BL31 lives INSIDE u-boot.itb (binman embeds it), so the
# download loader is just ddr+usbplug+spl (same 3-blob shape as aes, which also has no ATF).

[CHIP_NAME]
NAME=RK3568
[VERSION]
MAJOR=1
MINOR=1
[CODE471_OPTION]
NUM=1
Path1=bin/rk35/@DDR_BIN@
Sleep=1
[CODE472_OPTION]
NUM=1
Path1=bin/rk35/@USBPLUG_BIN@
[LOADER_OPTION]
NUM=2
LOADER1=FlashData
LOADER2=FlashBoot
FlashData=bin/rk35/@DDR_BIN@
FlashBoot=bin/rk35/@SPL_BIN@
[OUTPUT]
PATH=@LOADER_OUT@
[SYSTEM]
NEWIDB=true
[FLAG]
471_RC4_OFF=true
RC4_OFF=true
