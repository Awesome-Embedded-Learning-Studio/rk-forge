# toolchain.conf — declarative toolchain config.
# A future Python CLI reads this file DIRECTLY (no `export` side-effects here —
# scripts/lib/toolchain.sh does the exporting). RK3506 = 32-bit ARM Cortex-A7, armhf.

TOOLCHAIN_PREFIX="arm-linux-gnueabihf-"   # Debian/Ubuntu pkg: gcc-arm-linux-gnueabihf (hard-float)
ARCH="arm"

# Optional explicit locations. Leave empty to rely on PATH (the apt-installed
# toolchain). Set these only if you installed a toolchain tarball under /opt etc.
TOOLCHAIN_BIN_DIR=""                       # e.g. /opt/arm-gnu-toolchain/bin
TOOLCHAIN_SYSROOT=""                       # libc sysroot, if a custom toolchain needs it
