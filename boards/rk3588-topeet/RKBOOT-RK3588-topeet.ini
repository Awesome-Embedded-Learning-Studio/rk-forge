# RKBOOT-RK3588-topeet.ini — forge-owned loader recipe for boot_merger (rk3588-topeet).
#
# Produces the RKFW download loader (MiniLoaderAll.bin) for the eMMC update.img — the
# rkdeveloptool/RKDevTool `db` helper that brings the board into download mode (carries the
# Rockchip USB download protocol + the RK3588 chip tag). SEPARATE from the eMMC boot loader:
# the @0x40 idbloader that BootROM loads on EVERY boot is the mainline binman idbloader.img
# (build-uboot.sh), NOT this. binman's idbloader lacks the vendor download protocol, so the
# update.img still needs this boot_merger MiniLoaderAll purely as the one-shot download
# helper — built from the SAME public rkbin blobs (no vendor-sdk).
#
# Structure mirrors rkbin's RKBOOT/RK3588MINIALL.ini; @DDR_BIN@/@USBPLUG_BIN@/@SPL_BIN@ are
# blob FILENAMES (pack-loader.sh globs them via the board's RKBIN_*_PAT + substitutes). NO
# BL31 segment — ATF BL31 lives INSIDE u-boot.itb (binman embeds it), so the download loader
# is just ddr+usbplug+spl.
#
# RK3588-specific vs rk3568: NAME=RK3588, MINOR=11, and the extra [BOOT1_PARAM] section
# (8 WORD_x — rk3568's RKBOOT has no such section). Modeled verbatim on rkbin's template.

[CHIP_NAME]
NAME=RK3588
[VERSION]
MAJOR=1
MINOR=11
[CODE471_OPTION]
NUM=1
Path1=bin/rk35/@DDR_BIN@
Sleep=1
[CODE472_OPTION]
NUM=1
Path1=bin/rk35/@USBPLUG_BIN@
[LOADER_OPTION]
NUM=2
LOADER1=FlashData
LOADER2=FlashBoot
FlashData=bin/rk35/@DDR_BIN@
FlashBoot=bin/rk35/@SPL_BIN@
[OUTPUT]
PATH=@LOADER_OUT@
[SYSTEM]
NEWIDB=true
[FLAG]
471_RC4_OFF=true
RC4_OFF=true
[BOOT1_PARAM]
WORD_0=0x0
WORD_1=0x0
WORD_2=0x0
WORD_3=0x0
WORD_4=0x0
WORD_5=0x0
WORD_6=0x0
WORD_7=0x0
