# toolchain.conf — declarative toolchain config (DEFAULT board = aes / armhf).
#
# Board-specific toolchains now live in config/boards/<board>.env (TOOLCHAIN_*).
# This file is the project-default fallback + the historical home of the toolchain
# declaration; scripts/lib/toolchain.sh still reads it for the default board. For
# multi-board (e.g. rk3568-atk = aarch64), the board env overrides TOOLCHAIN_*.
#
# Arm GNU Toolchain 15.3.Rel1 (current target; supersedes 15.2.Rel1 which was
# board-verified for RK3506 boot+RW). 15.3 board-reverification is pending — the
# 15.2 path is kept commented as a known-good fallback. Installed under /opt.
TOOLCHAIN_PREFIX="arm-none-linux-gnueabihf-"
ARCH="arm"

# Absolute /opt bin dir (no ${PROJECT_ROOT} token needed). scripts/lib/toolchain.sh
# prepends this to PATH when env-setup.sh is sourced. The dir is also exported in
# ~/.zshrc / ~/.profile for ad-hoc cross-compilation outside the project.
TOOLCHAIN_BIN_DIR="/opt/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-linux-gnueabihf/bin"
TOOLCHAIN_SYSROOT=""

# --- Fallback: ATK vendor toolchain (gcc 10.3, board-verified, do not delete) ---
# Was the ACTUAL builder of our verified U-Boot/kernel/rootfs (produced
# rk3506-mainline.itb). NOT the Debian gcc-arm-linux-gnueabihf pkg. Flip
# TOOLCHAIN_BIN_DIR back here if the gcc 15.x rebuild fails on board.
# TOOLCHAIN_BIN_DIR="${PROJECT_ROOT}/reference/vendor-sdk/prebuilts/gcc/linux-x86/arm/gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf/bin"

