# config/boards/rk3588-topeet.yaml — iTOP-RK3588 (讯饶 topeet RK3588 EVB, eMMC).
# PR1: 1:1 faithful translation of config/boards/rk3588-topeet.env. RK3588 = A76×4
# + A55×4, aarch64, mainline-first (Collabora flagship: Panthor G610, Hantro+rkvdec2,
# RGA, RKCIF/rkisp1, mainline NPU "Rocket"). Structurally like rk3568-atk on every axis.

identity:
  board: rk3588-topeet
  soc: rk3588
  arch: arm64
  abi: aarch64
  cpu: cortex-a76                       # big core (big.LITTLE; defconfig targets big core)

kernel:
  base: v7.1
  dtb_name: rk3588-topeet               # ported from vendor topeet-rk3588-linux.dts (5.10) → mainline v7.1
  img: Image
  base_defconfig: arch/arm64/configs/defconfig
  fragments: [kernel.config]

# §5.1: per-board upstream refs (shared pool buildroot/drivers/busybox in forge.yaml).
sources:
  linux: {url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git, ref: v7.1}
  uboot: {url: https://gitlab.denx.de/u-boot/u-boot.git, ref: 5ca1a73c}

uboot:
  defconfig: evb-rk3588_defconfig
  defconfig_sd: ""
  fit_source: binman                    # binman emits idbloader.img + u-boot.itb (BL31 embedded); pack-fit must NOT re-pack
  arch_override: arm                    # explicit (PR2): Rockchip u-boot ships under arch/arm/ even for arm64

buildroot:
  defconfig: rk3588_topeet_defconfig    # retained for a future buildroot profile; UNUSED under --rootfs=ubuntu

wifi_driver: ""                         # AP6xxx module = mainline brcmfmac (CONFIG_BRCMFMAC); firmware from Ubuntu linux-firmware

storage:
  kind: emmc
  rootfs_mib: 3072                      # ext4 image size; < 4 GiB (RKAF entry size is uint32). 3 GiB fits ~2.4 GiB GNOME rootfs + headroom.

workspace:
  bringup_dir: boards/rk3588-topeet
  board_cfg_dir: boards/rk3588-topeet

rkbin:
  blob_subdir: bin/rk35
  spl_source: mainline                  # CRITICAL: vendor rk3588_spl v1.14 + BL31 v1.54 base mismatch → bootloop; mainline SPL matches BL31 v1.54
  blobs:
    ddr: rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.*.bin   # LP4+LP5 combo; glob picks rkbin default. DDR-fail → switch to lp4_1848/lp5_2112 glob.
    usbplug: rk3588_usbplug_v1.*.bin
    spl: rk3588_spl_v1.*.bin            # matches v1.14 (unused under spl_source=mainline, but resolved for loader ini / fallback)
    tee: rk3588_bl32_v*.bin             # BL32 = OP-TEE
    tee_exclude: ""
    bl31: rk3588_bl31_v*.elf            # ATF, embedded into u-boot.itb by binman

manifests:
  loader_ini: RKBOOT-RK3588-topeet.ini  # download loader = ddr+usbplug+spl only (BL31 lives inside u-boot.itb)
  parameter: {emmc: parameter-emmc-topeet.txt}
  package: {emmc: package-file-emmc.txt}

toolchain:
  prefix: aarch64-none-linux-gnu-
  bin_dir: /opt/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu/bin
  sysroot: ""
