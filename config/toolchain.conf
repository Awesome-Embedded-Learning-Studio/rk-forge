# toolchain.conf — declarative toolchain config.
# A future Python CLI reads this file DIRECTLY (no `export` side-effects here —
# scripts/lib/toolchain.sh does the exporting). RK3506 = 32-bit ARM Cortex-A7, armhf.

# Vendor-bundled Linaro A-profile toolchain (gcc 10.3, arm-none-linux-gnueabihf),
# shipped inside the ATK vendor SDK under third_party/vendor-sdk/prebuilts/. This
# is what ACTUALLY builds our U-Boot/kernel (verified: produced rk3506-mainline.itb).
# NOT the Debian `gcc-arm-linux-gnueabihf` pkg — that one is NOT installed; do not
# switch to it without re-verifying the binaries byte-for-byte.
TOOLCHAIN_PREFIX="arm-none-linux-gnueabihf-"
ARCH="arm"

# Explicit bin dir of the vendor toolchain. ${PROJECT_ROOT} is exported by
# scripts/lib/toolchain.sh BEFORE this file is sourced, so it expands here (and a
# future Python CLI can substitute the same token). Must be set: the toolchain is
# not on the default PATH, so a bare `source env-setup.sh` needs this to resolve.
TOOLCHAIN_BIN_DIR="${PROJECT_ROOT}/third_party/vendor-sdk/prebuilts/gcc/linux-x86/arm/gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf/bin"
TOOLCHAIN_SYSROOT=""
